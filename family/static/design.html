<!DOCTYPE html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idiograph design</title>
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<!--slot:icon-->
<!-- The design system's reference page, served at /design and named in docs/design.md, in no menu
     (15 October). It links the app's own stylesheets, the family's and each app's through the head's slot (the
     family codebase's fifth build, 23 October 2026), so it shows what the app shows, and writes each
     component's markup once, in the template below, which the script at the foot clones into a light
     panel and a dark panel side by side. Open it at 1280 and 360 wide before a merge and look for
     anything that moved. A new component goes here in the same change that makes it. -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<!--slot:head-->
<style>
  /* the page's own frame, in tokens alone: two panels side by side from 900px, one under the other
     below, each on its own theme's paper */
  .ds-head { max-width: 1280px; margin: 0 auto; padding: var(--sp-12) var(--gutter) var(--sp-8); }
  .ds-head .lede { font-size: var(--fs-name); margin: var(--sp-4) 0 0; max-width: 40em; animation: none; }
  .ds-panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-8); max-width: 1280px;
    margin: 0 auto; padding: 0 var(--gutter) var(--sp-12); }
  @media (min-width: 900px) { .ds-panels { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .ds-panel { min-width: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    border-radius: var(--r-card); padding: var(--sp-9); }
  .ds-theme { font-family: var(--serif); font-weight: 400; font-size: var(--fs-title); margin: 0 0 var(--sp-6); }
  .ds-sec { padding: var(--sp-9) 0; border-top: 1px solid var(--rule); }
  .ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4); margin: 0 0 var(--sp-6); }
  .ds-note { font-size: var(--fs-small); color: var(--ink-faint); margin: 0 0 var(--sp-4); }
  .ds-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: var(--sp-4); }
  .ds-swatch { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-5); align-items: center;
    padding: var(--sp-3); border: 1px solid var(--rule); border-radius: var(--r-box); background: var(--card); }
  .ds-chip { grid-row: span 3; width: 34px; height: 34px; border-radius: var(--r-control); border: 1px solid var(--rule-firm); }
  .ds-swatch code, .ds-type code { font-family: var(--mono); font-size: var(--fs-small); color: var(--ink); }
  .ds-what { font-size: var(--fs-small); color: var(--ink-soft); }
  .ds-val { font-family: var(--mono); font-size: var(--fs-label); color: var(--ink-faint); }
  .ds-type { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--sp-5); margin: 0 0 var(--sp-3); }
  .ds-type-sample { font-family: var(--serif); color: var(--ink); }
  /* what the app places over the page, set in the flow here so each can be seen at rest */
  .ds-panel .toast, .ds-panel .row-menu, .ds-panel .rail { position: static; animation: none; }
  .ds-panel .toast { margin: 0; max-width: 100%; }
  .ds-panel .row-menu { display: inline-grid; }
  .ds-panel .card { width: 100%; max-width: 100%; max-height: none; animation: none; }
  .ds-panel .rail { margin: 0 0 var(--sp-4); border: 1px solid var(--rule); }
  /* the statements bar's sample carries Distil's steps as the app's bar does, ES below 1600px (18 October), where
     the part's word stood from 1440px alone until then (17 October, later) */
  .ds-panel .settings-nav { display: inline-flex; padding-right: var(--sp-7); }
  .ds-panel .th-tabs { max-width: 22em; }
  /* the marks, four to a row, each at its sizes over its name, a part's at 16, 18 and 20 drawn for those pixels */
  .ds-marks { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5em, 1fr)); gap: var(--sp-6); margin: 0 0 var(--sp-8); }
  .ds-mark { display: flex; flex-direction: column; gap: var(--sp-3); }
  .ds-mark-sizes { display: flex; align-items: flex-end; gap: var(--sp-5); color: var(--ink); }
  .ds-mark .mark.s16 { width: 16px; height: 16px; }
  .ds-mark .mark.s18 { width: 18px; height: 18px; }
  .ds-mark .mark.s24 { width: 24px; height: 24px; }
  .ds-mark-name { font-size: var(--fs-small); color: var(--ink-soft); }
  .ds-panel .wordmark { margin: 0 0 var(--sp-4); }
  /* the minimap stands at the column's bottom right on the statements screen, and here in the flow, shown
     and hidden side by side */
  .ds-panel .ds-minimap { display: inline-flex; position: relative; right: auto; bottom: auto; vertical-align: bottom;
    margin: var(--sp-3) var(--sp-6) 0 0; }
  /* and the board's map, which stands over the zoom bar on PETs and GETs, here in the flow at its own size (18 October) */
  .ds-panel .ds-boardmap { position: relative; right: auto; bottom: auto; width: min(300px, 100%); margin: var(--sp-3) 0 0; }
  /* the guidance's sheet, open and standing in the panel rather than over the screen */
  .ds-panel .ds-sheet { position: relative; top: auto; right: auto; bottom: auto; z-index: auto; width: min(340px, 100%);
    max-height: none; transform: none; visibility: visible; box-shadow: var(--lift); }
  /* Search's card, standing in the panel rather than under the bar (17 October) */
  .ds-panel .ds-search { position: relative; top: auto; left: auto; right: auto; z-index: auto; margin: 0; box-shadow: var(--lift); }
  /* the statements screen's headings and a passage's row in the book's order, the places #work gives them in the
     app, and the current passage's card at the width of its column (17 October) */
  .ds-panel .ds-cols { --es-col: 1; --tx-col: 2; --en-col: 3; --col-gap: var(--sp-8);
    --cols: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 3fr); }
  .ds-panel .ds-cols .turn:hover { background: none; }
  .ds-panel .ds-card { max-width: 22em; }
</style>
</head>

<script>
/* Each panel takes its own copy of the components, the radio groups named apart, then each swatch its
   colour, its value in the panel's theme and its contrast on paper, card and sunk paper, and each line
   of the type scale its size. */
(() => {
  const hex = (v) => {
    const m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(v.trim());
    return m && !m[2] ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255) : null;
  };
  const lum = (rgb) => {
    const l = rgb.map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
    return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
  };
  const ratio = (a, b) => {
    const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  };
  const tpl = document.getElementById('ds-components');
  document.querySelectorAll('.ds-panel').forEach((panel, k) => {
    const body = panel.querySelector('.ds-body');
    body.appendChild(tpl.content.cloneNode(true));
    body.querySelectorAll('input[type="radio"]').forEach((r) => { r.name = `${r.name}-${k}`; });
    const look = getComputedStyle(panel);
    const tok = (name) => look.getPropertyValue(name).trim();
    const grounds = ['--paper', '--card', '--paper-sunk'].map((g) => hex(tok(g)));
    body.querySelectorAll('.ds-swatch').forEach((s) => {
      const name = s.dataset.token;
      s.querySelector('.ds-chip').style.background = `var(${name})`;
      const rgb = hex(tok(name));
      const said = rgb && grounds.every(Boolean) ? ` · ${grounds.map((g) => ratio(rgb, g).toFixed(1)).join(' · ')}` : '';
      s.querySelector('.ds-val').textContent = tok(name) + said;
    });
    body.querySelectorAll('.ds-type').forEach((p) => {
      p.querySelector('.ds-type-sample').style.fontSize = `var(${p.dataset.size})`;
      p.querySelector('.ds-val').textContent = tok(p.dataset.size);
    });
  });
})();
</script>
